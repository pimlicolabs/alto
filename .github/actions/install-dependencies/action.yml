name: "Install dependencies"
description: "Prepare repository and all dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8.15.4+sha256.cea6d0bdf2de3a0549582da3983c70c92ffc577ff4410cbf190817ddc35137c2

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        # Pinned: anvil >=1.8.1 mines asynchronously (eth_sendRawTransaction
        # returns before the tx is mined), breaking tests that rely on
        # synchronous automine.
        version: v1.7.1
