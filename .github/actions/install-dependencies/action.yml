name: "Install dependencies"
description: "Prepare repository and all dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8.15.4+sha256.cea6d0bdf2de3a0549582da3983c70c92ffc577ff4410cbf190817ddc35137c2

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        # Pinned nightly: the Glamsterdam e2e tests need anvil's Amsterdam
        # gas rules (EIP-2780, EIP-7976, EIP-8037), which no stable release
        # implements yet. anvil >=1.8.1 mines asynchronously, so tests wait
        # for receipts instead of relying on synchronous automine.
        version: nightly-f14e39d2a14d2ba9e9132b0aa7e10a3932a054fc
