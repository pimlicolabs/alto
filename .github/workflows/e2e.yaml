name: Run E2E Tests

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-e2e:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"

      - name: Set up foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned nightly: the Glamsterdam e2e tests need anvil's Amsterdam
          # gas rules (EIP-2780, EIP-7976, EIP-8037), which no stable release
          # implements yet. anvil >=1.8.1 mines asynchronously, so tests wait
          # for receipts instead of relying on synchronous automine.
          version: nightly-f14e39d2a14d2ba9e9132b0aa7e10a3932a054fc

      # Upstream anvil gives calls and transactions no EIP-8037 state gas
      # reservoir. The Glamsterdam tests run on an anvil built from
      # pimlicolabs/foundry's anvil-eip8037-reservoir branch, which has one.
      - name: Set up anvil with the EIP-8037 state gas reservoir
        run: |
          gh release download anvil-eip8037-4cfb645fe -R pimlicolabs/foundry -p anvil -D "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/anvil"
          echo "ANVIL_BINARY_PATH=$RUNNER_TEMP/anvil" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install test dependencies
        run: pnpm install

      - name: Start tests
        run: pnpm run test:ci
